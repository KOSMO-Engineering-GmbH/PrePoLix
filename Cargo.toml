[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/KwentiN-ui/prepolix"

[workspace.dependencies]
plx-core = { path = "crates/plx-core" }
plx-mesh = { path = "crates/plx-mesh" }
plx-model = { path = "crates/plx-model" }
plx-io = { path = "crates/plx-io" }
plx-results = { path = "crates/plx-results" }
plx-mesher = { path = "crates/plx-mesher" }
plx-job = { path = "crates/plx-job" }
plx-render = { path = "crates/plx-render" }

base64 = "0.22"
bytemuck = { version = "1.25", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "persistence", "wgpu", "wayland", "x11"] }
egui = "0.36"
egui-wgpu = "0.36"
env_logger = "0.11"
flate2 = "1"
gif = "0.14"
glam = { version = "0.34", features = ["bytemuck"] }
log = "0.4"
open = "5"
png = "0.18"
rfd = "0.17"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# Schnelles Profil für die CI: Abhängigkeiten unoptimiert, ohne Debug-Infos.
[profile.ci]
inherits = "dev"
debug = false

[profile.ci.package."*"]
opt-level = 0
