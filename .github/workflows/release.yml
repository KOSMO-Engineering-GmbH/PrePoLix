name: Release

# Baut den Windows-Installer auf Linux (MinGW + NSIS), das Linux-AppImage (beide mit CalculiX) und das
# Benutzerhandbuch (Typst, PDF; Installer und AppImage enthalten es als HTML für Help > User
# Guide), getrennt von der schnellen PR-CI. Läuft bei einem Versions-Tag (v0.1.0 usw.) und hängt
# alles an das GitHub-Release, oder per Hand über "Run workflow", dann nur als Artefakte.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
      - uses: actions/cache@v4
        with:
          path: |
            target/gmsh-windows
            target/ccx/windows
            target/typst
          key: gmsh-windows-${{ hashFiles('scripts/fetch_gmsh.py', 'scripts/fetch_ccx.py', 'installer/ccx/*', 'scripts/build_user_guide.sh') }}
      - name: MinGW und NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-mingw-w64-x86-64 nsis zstd
      - run: scripts/build_windows_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prepolix-windows-installer
          path: target/windows-installer/prepolix-*-setup.exe
          if-no-files-found: error
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Alle Jobs legen das Release bei Bedarf an; wer zweiter ist, findet es schon vor.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" target/windows-installer/prepolix-*-setup.exe --clobber

  linux-appimage:
    # Das älteste unterstützte Ubuntu: das AppImage läuft nur mit einer glibc, die mindestens so
    # neu ist wie die des Build-Systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-appimage
      - uses: actions/cache@v4
        with:
          path: |
            target/gmsh
            target/ccx/linux
            target/appimage/tools
            target/typst
          key: appimage-${{ hashFiles('scripts/fetch_gmsh.py', 'scripts/fetch_ccx.py', 'installer/ccx/*', 'scripts/build_appimage.sh', 'scripts/build_user_guide.sh') }}
      - name: Systembibliotheken
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libasound2-dev libglu1-mesa \
            libxft2 libxcursor1 libxinerama1 libgomp1 file zsync zstd
      - run: scripts/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prepolix-linux-appimage
          path: |
            target/appimage/prepolix-*-x86_64.AppImage
            target/appimage/prepolix-*-x86_64.AppImage.zsync
          if-no-files-found: error
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" target/appimage/prepolix-*-x86_64.AppImage \
            target/appimage/prepolix-*-x86_64.AppImage.zsync --clobber

  user-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: target/typst
          key: typst-${{ hashFiles('scripts/build_user_guide.sh') }}
      - name: Handbuch bauen
        run: scripts/build_user_guide.sh pdf
      - uses: actions/upload-artifact@v4
        with:
          name: prepolix-user-guide
          path: target/user-guide/prepolix-*-user-guide.pdf
          if-no-files-found: error
      - name: An das Release hängen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" target/user-guide/prepolix-*-user-guide.pdf --clobber
